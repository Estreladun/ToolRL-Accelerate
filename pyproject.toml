[project]
name = "toolrl-lite"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["torch>=2.5,<2.8", "transformers==4.51.3", "peft==0.15.2", "accelerate>=1.3,<2", "pyarrow>=16,<21", "safetensors>=0.4", "pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["upstream*", ".venv", "runs", "models", "data"]
